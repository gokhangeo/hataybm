<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İHALE TAKİP</title>
    
    <meta name="theme-color" content="#4f46e5">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📋</text></svg>'>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #333; margin: 0; }
        #dynamic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #main-app-container { display: none; padding: 20px; background-color: #f4f7f6;}
        .container { max-width: 1800px; margin: 0 auto; background-color: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; text-align: center; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        
        .city-selector-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px; background: #eef2f5; padding: 15px; border-radius: 8px; border: 1px solid #cce; }
        .city-selector-container label { font-size: 18px; font-weight: bold; color: #0056b3; }
        .city-selector-container select { width: 300px; font-size: 16px; padding: 10px; border-radius: 5px; border: 1px solid #0056b3; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        button:hover { opacity: 0.9; }
        button.danger { background-color: #dc3545; }
        button.success { background-color: #28a745; }
        button.info { background-color: #17a2b8; }
        button.warning { background-color: #ffc107; color: #212529; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.7; }

        @keyframes pulseWarning {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .btn-needs-save {
            animation: pulseWarning 1.5s infinite !important;
            background-color: #ffc107 !important;
            color: #000 !important;
            border: 2px solid #dc3545 !important;
            font-weight: bold;
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        th { background-color: #007bff; color: white; font-size: 14px; position: sticky; top: 0; z-index: 2;}
        tr:nth-child(even) { background-color: #f2f2f2; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[readonly], select[disabled] { background-color: #e9ecef; cursor: not-allowed; }
        .action-cell { width: 80px; text-align: center; }
        .check-cell { width: 40px; text-align: center; }
        .tamamlandi { text-decoration: red line-through; opacity: 0.6; background-color: #f0f0f0 !important; }
        
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .search-container { position: relative; width: 250px; }
        #aramaKutusu, #durumFiltresi { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        #kayitSayaci { margin-top: 10px; font-weight: bold; color: #0056b3; }
        
        .tabs-container { border-bottom: 2px solid #dee2e6; margin-bottom: 20px; display: flex; gap: 5px; flex-wrap: wrap; }
        .tab-btn { background-color: #f8f9fa; color: #007bff; border: 1px solid #dee2e6; border-bottom: none; padding: 10px 15px; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background-color: #007bff; color: white; border-color: #007bff; }
        .table-wrapper { display: none; }
        .table-wrapper.active { display: block; }
        
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background-color: #dc3545; color: white; padding: 1rem 2rem; border-radius: 0.5rem; transition: bottom 0.5s; z-index: 9999; }
        #toast.show { bottom: 30px; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 600px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-close-btn { margin-left: auto; }
        
        #yeni-kayit-alanlari { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

        <!-- ŞEHİR SEÇİM ALANI -->

<!-- Yeni Kayıt Ekle Modalı -->

    <div class="modal-content" style="max-width: 400px;">
        <h3>Yeni Kayıt Ekle</h3>
        <p style="margin: 0 0 15px 0; color: #0056b3; font-size: 16px;">

        <div style="display:flex; gap:10px;">

<script>
// ======================================================================
// ⚙️ GITHUB AYARLARI 
// ======================================================================
const GITHUB_KULLANICI_ADI = "gokhangeo";
const GITHUB_REPO_ADI = "hataybm";

const token_part1 = 'ghp_1Im4128xUP1uC8Oov';
const token_part2 = '8yBd7oahk2S6a0aGBTj';
const GITHUB_TOKEN = token_part1 + token_part2; 
// ======================================================================

const REPO_API_URL = `https://api.github.com/repos/${GITHUB_KULLANICI_ADI}/${GITHUB_REPO_ADI}/contents/`;

const SABIT_ILLER = ['ADANA', 'MERSİN', 'HATAY', 'OSMANİYE'];
let fileSHAs = {}; // Her ilin SHA değerini tutar
let currentIl = ''; 
let isDirty = false; 

// Aktif İl(ler) İçin Veri Yapısı
let globalData = {
    isTakipData: [],
    customColumns: [],
    durumlar: ['YER TESLİMİ YAPILDI', 'TAPU KAYIT KARŞILAŞTIRMA', 'DEĞERLENDİRMEDE', 'ASKI İLANINA HAZIRLANIYOR', 'KOMİSYON AŞAMASINDA', 'KESİN ASKIDA', 'DEVİR YAPILDI', 'TESCİLİ BİTTİ'],
    uygulamalar: ['GÜNCELLEME', 'GÜNCELLEME(2026)', '2/B']
};

let currentEditingRowKey = null;
let confirmCallback = null;

document.addEventListener('DOMContentLoaded', function() {
    initAnimatedBackground();
    baslangicKurulumu(); 
    
    document.getElementById('aramaKutusu').addEventListener('keyup', filtrele);
    document.getElementById('durumFiltresi').addEventListener('change', filtrele);
    document.getElementById('ilGuncelleBtn').addEventListener('click', loadSelectedIl);
    document.getElementById('githubKaydetBtn').addEventListener('click', saveToGitHub);
    document.getElementById('excelIndirBtn').addEventListener('click', excelIndirTumIller);
    document.getElementById('tableContainer').addEventListener('change', handleTableChange);
    document.getElementById('tableContainer').addEventListener('click', handleTableClick);

    // Yeni Kayıt Butonu Dinleyicisi
    document.getElementById('yeniKayitBtn').addEventListener('click', () => {
        if (currentIl === 'TÜM İLLER') {
            alert("Lütfen yeni kayıt eklemek için önce yukarıdaki menüden işlem yapmak istediğiniz ili seçin (Adana, Mersin, Hatay, Osmaniye).");
            return;
        }

        document.getElementById('modal-aktif-il').textContent = currentIl;
        document.getElementById('yeni-ilce').value = '';
        document.getElementById('yeni-birim').value = '';
        document.getElementById('yeni-uygulama').value = 'GÜNCELLEME';
        toggleYeniKayitAlanlari();
        document.getElementById('yeni-kayit-modal').style.display = 'flex';
    });

    document.getElementById('yeni-kayit-kaydet').addEventListener('click', addYeniKayit);
    document.getElementById('sutunYonetimiBtn').addEventListener('click', openSutunYonetimi);
    document.getElementById('yeni-sutun-ekle').addEventListener('click', addNewColumn);

    document.querySelectorAll('.modal-close-btn').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('.modal').style.display = 'none');
    });
    
    document.getElementById('not-modal-save').addEventListener('click', saveNoteChanges);
    document.getElementById('confirm-yes').addEventListener('click', () => {
        document.getElementById('confirm-modal').style.display = 'none';
        if(confirmCallback) confirmCallback();
    });
});

function toggleYeniKayitAlanlari() {
    const uygulama = document.getElementById('yeni-uygulama').value;
    const digerInput = document.getElementById('yeni-uygulama-diger');
    const alanlar = document.getElementById('yeni-kayit-alanlari');
    
    digerInput.style.display = uygulama === 'DİĞER' ? 'block' : 'none';
    
    if (uygulama === 'GÜNCELLEME') {
        alanlar.innerHTML = `
            <input type="number" id="yeni-guncelleme-parsel" placeholder="Güncelleme Parsel Sayısı">
            <input type="number" id="yeni-ido-parsel" placeholder="İDÖ Parsel Sayısı">
        `;
    } else if (uygulama === '2/B') {
        alanlar.innerHTML = `
            <input type="number" id="yeni-2b-parsel" placeholder="Parsel Sayısı">
            <input type="number" id="yeni-2b-blok" placeholder="Blok Sayısı">
        `;
    } else {
        alanlar.innerHTML = '';
    }
}

function showConfirmModal(message, onConfirm) {
    document.getElementById('confirm-message').textContent = message;
    confirmCallback = onConfirm;
    document.getElementById('confirm-modal').style.display = 'flex';
}

function initAnimatedBackground() {
    const bgCanvas = document.getElementById('dynamic-bg');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const gradient = document.createElement('canvas').getContext('2d');
    gradient.canvas.width = 1; gradient.canvas.height = 512;
    const g = gradient.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, '#87CEEB'); g.addColorStop(1, '#B0E0E6'); 
    gradient.fillStyle = g; gradient.fillRect(0, 0, 1, 512);
    scene.background = new THREE.CanvasTexture(gradient.canvas);
    
    const particles = new THREE.BufferGeometry();
    const posArray = new Float32Array(3000 * 3);
    for(let i=0; i<9000; i++) posArray[i] = (Math.random() - 0.5) * 15;
    particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const mesh = new THREE.Points(particles, new THREE.PointsMaterial({ size: 0.015, color: 0xffffff }));
    scene.add(mesh);
    camera.position.z = 5;
    
    const clock = new THREE.Clock();
    const animate = () => {
        mesh.rotation.y = -0.05 * clock.getElapsedTime();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    };
    animate();
}

async function baslangicKurulumu() {
    document.getElementById('main-app-container').style.display = 'block';
    
    const ilSecici = document.getElementById('ilSecici');
    ilSecici.innerHTML = '<option value="TÜM İLLER">TÜM İLLER (Genel Görünüm)</option>';
    SABIT_ILLER.forEach(il => {
        ilSecici.innerHTML += `<option value="${il}">${il}</option>`;
    });

    currentIl = 'ADANA'; // Başlangıçta ilk ili seçili yapıyoruz
    ilSecici.value = currentIl;
    await fetchCityData(currentIl);
}

async function loadSelectedIl() {
    const secili = document.getElementById('ilSecici').value;
    if (secili && secili !== currentIl) {
        if (isDirty) {
            showConfirmModal("Kaydedilmemiş değişiklikleriniz var! Başka bir ile geçerseniz bu değişiklikler kaybolabilir. Yine de geçmek istiyor musunuz?", async () => {
                isDirty = false;
                markAsClean();
                await fetchCityData(secili);
            });
        } else {
            await fetchCityData(secili);
        }
    }
}

async function fetchSingleCity(ilAdi, isAppend) {
    const fileName = `${ilAdi}.json`;
    const url = `${REPO_API_URL}${fileName}`;
    
    try {
        const response = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` }, cache: 'no-cache' });
        
        if (response.ok) {
            const data = await response.json();
            fileSHAs[ilAdi] = data.sha;
            const parsed = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            
            // Eğer isTakipData içindeki kayıtlarda il yoksa, garanti altına al
            if (parsed.isTakipData) {
                parsed.isTakipData.forEach(r => r['İL'] = ilAdi);
            }

            if (isAppend) {
                if(parsed.isTakipData) globalData.isTakipData = globalData.isTakipData.concat(parsed.isTakipData);
                if(parsed.customColumns) {
                    parsed.customColumns.forEach(c => {
                        if(!globalData.customColumns.includes(c)) globalData.customColumns.push(c);
                    });
                }
            } else {
                globalData = { ...globalData, ...parsed };
                if (globalData.isTakipData) globalData.isTakipData.forEach(r => r['İL'] = ilAdi);
            }
        } else if (response.status === 404) {
            fileSHAs[ilAdi] = ''; // Dosya yoksa boş
            console.log(`${ilAdi} için henüz bir kayıt dosyası yok.`);
        } else {
            throw new Error(`Hata Kodu: ${response.status}`);
        }
    } catch (error) {
        console.error(`${ilAdi} verisi çekilirken hata: ${error.message}`);
    }
}

async function fetchCityData(secilenIl) {
    document.getElementById('loader').style.display = 'block';
    currentIl = secilenIl.toUpperCase();
    
    // Verileri temizle
    globalData = {
        isTakipData: [],
        customColumns: [],
        durumlar: ['YER TESLİMİ YAPILDI', 'TAPU KAYIT KARŞILAŞTIRMA', 'DEĞERLENDİRMEDE', 'ASKI İLANINA HAZIRLANIYOR', 'KOMİSYON AŞAMASINDA', 'KESİN ASKIDA', 'DEVİR YAPILDI', 'TESCİLİ BİTTİ'],
        uygulamalar: ['GÜNCELLEME', 'GÜNCELLEME(2026)', '2/B']
    };

    try {
        if (currentIl === 'TÜM İLLER') {
            for (const il of SABIT_ILLER) {
                await fetchSingleCity(il, true); // true = append
            }
        } else {
            await fetchSingleCity(currentIl, false); // false = overwrite
        }

        document.getElementById('ilSecici').value = currentIl;
        renderAllTables();
        
        document.getElementById('uyari').style.display = 'block';
        document.getElementById('githubKaydetBtn').disabled = false;
        
        // Yeni sütun ekleme butonu TÜM İLLER görünümünde kapatılsın (karışıklığı önlemek için)
        document.getElementById('sutunYonetimiBtn').disabled = (currentIl === 'TÜM İLLER');

        markAsClean();
        durumFiltresiDoldur();
        
        const firstTab = document.querySelector('.tab-btn');
        if (firstTab) showTab(firstTab.dataset.uygulama);

    } catch (error) {
        alert("Veri çekilirken bir sorun oluştu: " + error.message);
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

function renderAllTables() {
    const tableContainer = document.getElementById('tableContainer');
    const tabsContainer = document.getElementById('tabs');
    tableContainer.innerHTML = '';
    tabsContainer.innerHTML = '';

    const isler = globalData.isTakipData;
    const mudurlukIsleri = isler.filter(row => row['İHALELİ/MÜDÜRLÜK'] === 'Müdürlük');
    const ihaleIsleri = isler.filter(row => row['İHALELİ/MÜDÜRLÜK'] !== 'Müdürlük');

    const groupedData = ihaleIsleri.reduce((acc, row) => {
        const groupName = row['UYGULAMA'] || 'DİĞER';
        if (!acc[groupName]) acc[groupName] = [];
        acc[groupName].push(row);
        return acc;
    }, {});

    const renderTable = (veriGrubu, uygulamaAdi) => {
        if (!veriGrubu || veriGrubu.length === 0) return;

        const tab = document.createElement('button');
        tab.className = 'tab-btn';
        tab.textContent = `${uygulamaAdi} (${veriGrubu.length})`;
        tab.dataset.uygulama = uygulamaAdi;
        tab.onclick = () => showTab(uygulamaAdi);
        tabsContainer.appendChild(tab);

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-wrapper';
        tableWrapper.dataset.group = uygulamaAdi;
        
        let dinamikSutunlarHTML = '';
        if (uygulamaAdi === 'GÜNCELLEME' || uygulamaAdi === 'GÜNCELLEME(2026)') {
            dinamikSutunlarHTML = `<th>GÜNCELLEME PARSEL</th><th>İDÖ PARSEL</th><th>TOPLAM PARSEL</th>`;
        } else if (uygulamaAdi === '2/B') {
            dinamikSutunlarHTML = `<th>PARSEL SAYISI</th><th>BLOK SAYISI</th>`;
        } else {
            dinamikSutunlarHTML = `<th>PARSEL SAYISI</th>`; 
        }

        let customColsHTML = globalData.customColumns.map(col => `<th>${col}</th>`).join('');

        const table = document.createElement('table');
        table.innerHTML = `
            <thead><tr>
                <th class="check-cell">&#10004;</th>
                <th>İL</th>
                <th>İLÇE</th>
                <th>BİRİM</th>
                <th>UYGULAMA</th>
                <th>NOT</th>
                ${dinamikSutunlarHTML}
                <th>DURUMU</th>
                ${customColsHTML}
                <th class="action-cell">SİL</th>
            </tr></thead>
            <tbody>
                ${veriGrubu.map(row => createRowHTML(row, uygulamaAdi)).join('')}
            </tbody>
        `;
        tableWrapper.appendChild(table);
        tableContainer.appendChild(tableWrapper);
    };

    Object.keys(groupedData).forEach(uygulama => renderTable(groupedData[uygulama], uygulama));
    renderTable(mudurlukIsleri, 'Müdürlük');
}

function createRowHTML(data, tabType) {
    const rowKey = data._ui_id; 
    const isChecked = data['Tamamlandı'] === 'EVET';
    const checkedClass = isChecked ? 'class="tamamlandi"' : '';
    const hasNote = data['NOTLAR'] && data['NOTLAR'].trim() !== '';

    let dinamikHucrelerHTML = '';
    if (tabType === 'GÜNCELLEME' || tabType === 'GÜNCELLEME(2026)') {
        const parsel = Number(data['GÜNCELLEME PARSEL']) || 0;
        const ido = Number(data['İDÖ PARSEL']) || 0;
        const toplam = parsel + ido;
        dinamikHucrelerHTML = `
            <td><input type="number" data-header="GÜNCELLEME PARSEL" value="${parsel || ''}"></td>
            <td><input type="number" data-header="İDÖ PARSEL" value="${ido || ''}"></td>
            <td><input type="number" data-header="TOPLAM PARSEL" value="${toplam}" readonly style="background:#e9ecef; font-weight:bold;"></td>
        `;
    } else if (tabType === '2/B') {
        dinamikHucrelerHTML = `
            <td><input type="number" data-header="PARSEL SAYISI" value="${data['PARSEL SAYISI'] || ''}"></td>
            <td><input type="number" data-header="BLOK SAYISI" value="${data['BLOK SAYISI'] || ''}"></td>
        `;
    } else {
        dinamikHucrelerHTML = `<td><input type="number" data-header="PARSEL SAYISI" value="${data['PARSEL SAYISI'] || ''}"></td>`;
    }

    const durumOptions = globalData.durumlar.map(d => `<option value="${d}" ${data['DURUMU'] === d ? 'selected' : ''}>${d}</option>`).join('');
    const customColsHTML = globalData.customColumns.map(col => `<td><input type="text" data-header="${col}" value="${data[col] || ''}"></td>`).join('');

    return `
        <tr data-row-key="${rowKey}" ${checkedClass}>
            <td class="check-cell"><input type="checkbox" data-header="Tamamlandı" ${isChecked ? 'checked' : ''}></td>
            <td><input type="text" data-header="İL" value="${data['İL'] || currentIl}" readonly style="background:#e9ecef; font-weight:bold;"></td>
            <td><input type="text" data-header="İLÇE" value="${data['İLÇE'] || ''}"></td>
            <td><input type="text" data-header="BİRİM" value="${data['BİRİM'] || ''}"></td>
            <td><input type="text" data-header="UYGULAMA" value="${data['UYGULAMA'] || ''}" readonly></td>
            <td class="action-btn-cell"><button class="not-btn ${hasNote ? 'has-note' : ''}">Not</button></td>
            ${dinamikHucrelerHTML}
            <td><select data-header="DURUMU"><option value=""></option>${durumOptions}</select></td>
            ${customColsHTML}
            <td class="action-btn-cell"><button class="danger delete-row-btn">🗑️</button></td>
        </tr>
    `;
}

function handleTableClick(event) {
    const target = event.target;
    const button = target.closest('button');
    if (!button) return;

    const tr = button.closest('tr');
    if(!tr) return;
    const rowKey = tr.dataset.rowKey;

    if (button.classList.contains('delete-row-btn')) {
        showConfirmModal('Bu kaydı silmek istediğinize emin misiniz?', () => {
            globalData.isTakipData = globalData.isTakipData.filter(r => r._ui_id !== rowKey);
            markAsDirty();
            renderAllTables();
            showToast('Kayıt silindi. Lütfen değişiklikleri kaydetmeyi unutmayın.');
        });
    } else if (button.classList.contains('not-btn')) {
        currentEditingRowKey = rowKey;
        const dataRow = globalData.isTakipData.find(r => r._ui_id === currentEditingRowKey);
        if (dataRow) {
            document.getElementById('not-modal-textarea').value = dataRow['NOTLAR'] || '';
            document.getElementById('not-modal').style.display = 'flex';
        }
    }
}

function handleTableChange(event) {
    const target = event.target;
    if (target.tagName === 'INPUT' || target.tagName === 'SELECT') {
        const row = target.closest('tr');
        if (!row || !row.dataset.rowKey) return;
        
        const rowKey = row.dataset.rowKey;
        const header = target.dataset.header;
        const value = target.type === 'checkbox' ? (target.checked ? 'EVET' : 'HAYIR') : target.value;

        const dataRow = globalData.isTakipData.find(r => r._ui_id === rowKey);
        if (dataRow) {
            dataRow[header] = value;
            
            if (header === 'GÜNCELLEME PARSEL' || header === 'İDÖ PARSEL') {
                const parsel = Number(dataRow['GÜNCELLEME PARSEL']) || 0;
                const ido = Number(dataRow['İDÖ PARSEL']) || 0;
                dataRow['TOPLAM PARSEL'] = parsel + ido;
                
                const toplamInput = row.querySelector('[data-header="TOPLAM PARSEL"]');
                if(toplamInput) toplamInput.value = dataRow['TOPLAM PARSEL'];
            }
        }
        
        if (target.type === 'checkbox' && header === 'Tamamlandı') {
             row.classList.toggle('tamamlandi', target.checked);
        }
        markAsDirty();
    }
}

async function addYeniKayit() {
    const il = currentIl; 
    const ilce = document.getElementById('yeni-ilce').value.trim().toUpperCase();
    const birim = document.getElementById('yeni-birim').value.trim().toUpperCase();
    let uygulama = document.getElementById('yeni-uygulama').value;
    const ihaleli = document.getElementById('yeni-ihaleli-mudurluk').value;

    if (uygulama === 'DİĞER') {
        uygulama = document.getElementById('yeni-uygulama-diger').value.trim().toUpperCase() || 'DİĞER';
        if (!globalData.uygulamalar.includes(uygulama)) globalData.uygulamalar.push(uygulama);
    }

    if(!ilce || !birim) {
        alert("Lütfen İlçe ve Birim bilgilerini eksiksiz giriniz.");
        return;
    }

    const newRow = {
        _ui_id: 'row_' + Date.now(),
        'Tamamlandı': 'HAYIR',
        'İL': il,
        'İLÇE': ilce,
        'BİRİM': birim,
        'UYGULAMA': uygulama,
        'İHALELİ/MÜDÜRLÜK': ihaleli,
        'DURUMU': ''
    };

    if (uygulama === 'GÜNCELLEME') {
        newRow['GÜNCELLEME PARSEL'] = document.getElementById('yeni-guncelleme-parsel').value || 0;
        newRow['İDÖ PARSEL'] = document.getElementById('yeni-ido-parsel').value || 0;
        newRow['TOPLAM PARSEL'] = Number(newRow['GÜNCELLEME PARSEL']) + Number(newRow['İDÖ PARSEL']);
    } else if (uygulama === '2/B') {
        newRow['PARSEL SAYISI'] = document.getElementById('yeni-2b-parsel').value || 0;
        newRow['BLOK SAYISI'] = document.getElementById('yeni-2b-blok').value || 0;
    }

    globalData.isTakipData.unshift(newRow); 
    document.getElementById('yeni-kayit-modal').style.display = 'none';
    markAsDirty();
    renderAllTables();
    
    const targetTab = ihaleli === 'Müdürlük' ? 'Müdürlük' : uygulama;
    showTab(targetTab);
    
    // Doğrudan kaydet, böylece dosya ilk kez oluşsa bile garanti altına alınır.
    await saveToGitHub();
    showToast(`${il} için yeni kayıt eklendi ve sisteme işlendi.`);
}

function openSutunYonetimi() {
    const listDiv = document.getElementById('mevcut-sutunlar');
    listDiv.innerHTML = '';
    if(globalData.customColumns.length === 0) {
        listDiv.innerHTML = '<p>Henüz eklenmiş özel bir sütun yok.</p>';
    } else {
        globalData.customColumns.forEach(col => {
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.marginBottom = '5px';
            div.innerHTML = `<span>${col}</span> <button class="danger" style="padding:2px 8px;" onclick="removeCustomColumn('${col}')">Sil</button>`;
            listDiv.appendChild(div);
        });
    }
    document.getElementById('sutun-yonetimi-modal').style.display = 'flex';
}

function addNewColumn() {
    const colName = document.getElementById('yeni-sutun-adi').value.trim().toUpperCase();
    if(colName && !globalData.customColumns.includes(colName)){
        globalData.customColumns.push(colName);
        document.getElementById('yeni-sutun-adi').value = '';
        markAsDirty();
        renderAllTables();
        openSutunYonetimi();
        showToast('Sütun eklendi.');
    }
}

window.removeCustomColumn = function(colName) {
    showConfirmModal(`"${colName}" sütununu silmek istediğinize emin misiniz?`, () => {
        globalData.customColumns = globalData.customColumns.filter(c => c !== colName);
        globalData.isTakipData.forEach(row => delete row[colName]); 
        markAsDirty();
        renderAllTables();
        openSutunYonetimi();
        showToast('Sütun silindi.');
    });
};

function saveNoteChanges() {
    if (!currentEditingRowKey) return;
    const dataRow = globalData.isTakipData.find(r => r._ui_id === currentEditingRowKey);
    if (dataRow) {
        dataRow['NOTLAR'] = document.getElementById('not-modal-textarea').value.trim();
        document.getElementById('not-modal').style.display = 'none';
        markAsDirty();
        renderAllTables();
        showToast('Not güncellendi.');
    }
}

async function saveToGitHub() {
    const btn = document.getElementById('githubKaydetBtn');
    btn.disabled = true;
    btn.innerHTML = 'Kaydediliyor...';
    
    try {
        if (currentIl === 'TÜM İLLER') {
            // "TÜM İLLER" ekranındaysak, verileri il bazında ayırıp ayrı ayrı kaydetmemiz gerekir
            const grouped = {};
            SABIT_ILLER.forEach(il => grouped[il] = []);
            globalData.isTakipData.forEach(row => {
                const il = row['İL'];
                if(grouped[il]) grouped[il].push(row);
            });
            
            for (const il of SABIT_ILLER) {
                const ilData = {
                    isTakipData: grouped[il],
                    customColumns: globalData.customColumns,
                    durumlar: globalData.durumlar,
                    uygulamalar: globalData.uygulamalar
                };
                await saveData(il, ilData, fileSHAs[il]);
            }
        } else {
            // Tek bir il ekranındaysak sadece onu kaydet
            await saveData(currentIl, globalData, fileSHAs[currentIl]);
        }
        
        markAsClean();
        showToast("Tüm değişiklikler başarıyla GitHub'a kaydedildi!");
    } catch (error) {
        markAsDirty(); // Kayıt tamamlanmadığı için buton uyarısı devam etsin
        alert("Kaydetme Başarısız: \n" + error.message + "\n\n(Not: Token süresi dolmuş veya hatalı olabilir. Yeni bir Token almayı deneyin.)");
    } finally {
        btn.disabled = false;
    }
}

async function saveData(ilAdi, dataObj, shaParam) {
    const jsonString = JSON.stringify(dataObj, null, 2);
    const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

    const payload = {
        message: `${ilAdi} - Veri Güncellemesi - ${new Date().toLocaleString()}`,
        content: base64Content
    };
    if(shaParam) payload.sha = shaParam; // Eğer dosya yeniyse bu boş gider, Github yeni dosya oluşturur

    const url = `${REPO_API_URL}${ilAdi}.json`;
    const putResponse = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (!putResponse.ok) {
        const errorData = await putResponse.json().catch(() => ({}));
        throw new Error(errorData.message || `Hata Kodu: ${putResponse.status}`);
    }

    const responseData = await putResponse.json();
    
    // İşlem başarılıysa bellekteki SHA kodunu güncelle
    fileSHAs[ilAdi] = responseData.content.sha;
}

async function excelIndirTumIller() {
    document.getElementById('loader').style.display = 'block';
    showToast("Veriler toplanıyor, lütfen bekleyin...");
    
    let allCombinedData = [];
    
    for (const il of SABIT_ILLER) {
        try {
            const response = await fetch(`${REPO_API_URL}${il}.json`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
            if (response.ok) {
                const data = await response.json();
                const jsonString = decodeURIComponent(escape(atob(data.content)));
                const parsed = JSON.parse(jsonString);
                
                if (parsed && parsed.isTakipData) {
                    parsed.isTakipData.forEach(row => {
                        row['İL'] = il; 
                        const cleanRow = { ...row };
                        delete cleanRow._ui_id;
                        allCombinedData.push(cleanRow);
                    });
                }
            }
        } catch(e) {
            console.error(`${il} verisi alınamadı.`, e);
        }
    }
    
    if (allCombinedData.length > 0) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(allCombinedData);
        XLSX.utils.book_append_sheet(wb, ws, 'Tüm İller Kayıtları');
        XLSX.writeFile(wb, `IhaleTakip_TumIller_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast("Tüm iller başarıyla Excel olarak indirildi.");
    } else {
        alert("Dışa aktarılacak veri bulunamadı.");
    }
    
    document.getElementById('loader').style.display = 'none';
}

function showTab(uygulamaAdi) {
    document.querySelectorAll('.table-wrapper').forEach(w => w.classList.remove('active'));
    const target = document.querySelector(`.table-wrapper[data-group="${uygulamaAdi}"]`);
    if(target) target.classList.add('active');
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.uygulama === uygulamaAdi) btn.classList.add('active');
    });
    filtrele();
}

function durumFiltresiDoldur() {
    const select = document.getElementById('durumFiltresi');
    select.innerHTML = '<option value="">Tüm Durumlar</option>';
    globalData.durumlar.forEach(d => {
        select.innerHTML += `<option value="${d}">${d}</option>`;
    });
}

function filtrele() {
    const arama = document.getElementById('aramaKutusu').value.toLocaleUpperCase('tr-TR');
    const durum = document.getElementById('durumFiltresi').value.toUpperCase();
    let sayac = 0;

    const activeTable = document.querySelector('.table-wrapper.active tbody');
    if(!activeTable) return;

    activeTable.querySelectorAll('tr').forEach(row => {
        const metin = row.textContent.toLocaleUpperCase('tr-TR');
        const dSelect = row.querySelector('select[data-header="DURUMU"]');
        const rowDurum = dSelect ? dSelect.value.toUpperCase() : '';
        
        const match = metin.includes(arama) && (durum === '' || rowDurum === durum);
        row.style.display = match ? '' : 'none';
        if(match) sayac++;
    });

    document.getElementById('kayitSayaci').textContent = `Toplam ${sayac} kayıt gösteriliyor.`;
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = "show";
    setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
}

function markAsDirty() {
    if (!isDirty) {
        isDirty = true;
        showToast("⚠️ Değişiklik yaptınız, KAYDET butonuna basmayı unutmayın!");
    }
    const btn = document.getElementById('githubKaydetBtn');
    btn.classList.add('btn-needs-save');
    btn.innerHTML = `⚠️ KAYDET (Değişiklik Var)`;
}

function markAsClean() {
    isDirty = false;
    const btn = document.getElementById('githubKaydetBtn');
    btn.classList.remove('btn-needs-save');
    btn.classList.add('success');
    btn.innerHTML = `💾 Kaydet`;
}
</script>
